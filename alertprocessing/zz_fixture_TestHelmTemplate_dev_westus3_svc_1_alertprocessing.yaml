                  message: end must be after start
                properties:
                  filter:
                    type: string
                    minLength: 1
                  jira:
                    type: string
                  reason:
                    type: string
                  start:
                    type: string
                    format: date-time
                  end:
                    type: string
                    format: date-time
          status:
            type: object
            properties:
              conditions:
                type: array
                items:
                  type: object
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  properties:
                    lastTransitionTime:
                      type: string
                      format: date-time
                    message:
                      type: string
                      maxLength: 32768
                    observedGeneration:
                      type: integer
                      format: int64
                      minimum: 0
                    reason:
                      type: string
                      maxLength: 1024
                    status:
                      type: string
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                    type:
                      type: string
                      maxLength: 316
                x-kubernetes-list-map-keys:
                - type
