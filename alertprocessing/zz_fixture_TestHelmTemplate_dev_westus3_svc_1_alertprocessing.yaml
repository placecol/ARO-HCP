# Source: alertprocessing/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertprocessing
  namespace: alertprocessing
  labels:
    app.kubernetes.io/name: alertprocessing
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alertprocessing
  replicas: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertprocessing
        azure.workload.identity/use: "true"
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - command:
        - "/alertprocessing"
        args:
        - controller
        - "--health-address=:8080"
        - "--log-verbosity=2"
        - "--subscription-id=__subscriptionId__"
        - "--regional-rg=hcp-underlay-dev-westus3-apr"
        - "--hcps-amw-id=/subscriptions/__subscriptionId__/resourceGroups/hcp-underlay-dev-westus3/providers/Microsoft.Monitor/accounts/hcps-usw3"
        - "--services-amw-id=/subscriptions/__subscriptionId__/resourceGroups/hcp-underlay-dev-westus3/providers/Microsoft.Monitor/accounts/services-usw3"
        - "--default-action-group-id=/subscriptions/__subscriptionId__/resourceGroups/hcp-underlay-dev-westus3/providers/microsoft.insights/actionGroups/alertprocessing-default"
        - "--catalog-poll-interval=5m"
        image: "arohcpsvcdev.azurecr.io/arohcpalertprocessing@sha256:1234567890"
        name: alertprocessing-controller
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: AZURE_TOKEN_CREDENTIALS
          value: "WorkloadIdentityCredential"
        ports:
        - containerPort: 8080
          protocol: TCP
          name: health
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
          readOnlyRootFilesystem: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
      serviceAccountName: alertprocessing
      terminationGracePeriodSeconds: 10
      nodeSelector: 
        {}
      affinity: 
        {}
      tolerations: 
        []

